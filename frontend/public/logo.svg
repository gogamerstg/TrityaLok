<svg viewBox="0 0 120 120" width="120" height="120" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="md_cyan_glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="60%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#0369A1" />
    </linearGradient>

    <linearGradient id="md_violet_flame" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8B5CF6" />
      <stop offset="50%" stop-color="#A855F7" />
      <stop offset="100%" stop-color="#EC4899" />
    </linearGradient>

    <linearGradient id="md_gold_beacon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>

    <linearGradient id="facet_top" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.8" />
    </linearGradient>

    <linearGradient id="facet_left" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0369A1" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#070A0F" stop-opacity="0.95" />
    </linearGradient>

    <linearGradient id="facet_right" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7C3AED" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#070A0F" stop-opacity="0.95" />
    </linearGradient>

    <filter id="neon_glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="star_bloom" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="5" result="bloom" />
      <feComposite in="SourceGraphic" in2="bloom" operator="over" />
    </filter>
  </defs>

  <!-- Ambient Radar Outer Rings -->
  <circle cx="60" cy="60" r="54" stroke="url(#md_cyan_glow)" stroke-width="1.2" stroke-dasharray="3 4" opacity="0.45" />
  <circle cx="60" cy="60" r="46" stroke="#1E293B" stroke-width="1.2" opacity="0.7" />

  <!-- 3D Isometric Crystal Prism Facets -->
  <polygon points="60,18 94,37 60,56 26,37" fill="url(#facet_top)" stroke="url(#md_cyan_glow)" stroke-width="1.8" stroke-linejoin="round" />
  <polygon points="26,37 60,56 60,98 26,79" fill="url(#facet_left)" stroke="url(#md_cyan_glow)" stroke-width="1.8" stroke-linejoin="round" opacity="0.95" />
  <polygon points="60,56 94,37 94,79 60,98" fill="url(#facet_right)" stroke="url(#md_violet_flame)" stroke-width="1.8" stroke-linejoin="round" opacity="0.95" />

  <!-- Interwoven M & D Trajectory Ribbons -->
  <path d="M 36,73 L 48,50 L 60,66 L 72,50 L 84,73" stroke="url(#md_cyan_glow)" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round" filter="url(#neon_glow)" />
  <path d="M 60,66 C 76,58 90,44 78,30 C 68,18 52,24 60,38" stroke="url(#md_violet_flame)" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round" filter="url(#neon_glow)" />
  <path d="M 48,50 Q 60,34 72,50" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" opacity="0.85" />

  <!-- Central Star of Marg Darshak -->
  <g filter="url(#star_bloom)">
    <path d="M 60,44 L 63.5,56.5 L 76,60 L 63.5,63.5 L 60,76 L 56.5,63.5 L 44,60 L 56.5,56.5 Z" fill="url(#md_gold_beacon)" />
    <circle cx="60" cy="60" r="3.5" fill="#FFFFFF" />
  </g>

  <!-- Photogrammetry Keypoint Nodes -->
  <circle cx="26" cy="37" r="3.2" fill="#00F2FE" filter="url(#neon_glow)" />
  <circle cx="94" cy="37" r="3.2" fill="#A855F7" filter="url(#neon_glow)" />
  <circle cx="60" cy="98" r="3.2" fill="#34D399" filter="url(#neon_glow)" />
  <circle cx="60" cy="18" r="3.2" fill="#FDE047" filter="url(#neon_glow)" />
  <circle cx="72" cy="50" r="2.5" fill="#FFFFFF" />
  <circle cx="48" cy="50" r="2.5" fill="#00F2FE" />
</svg>
